name: Dependency Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          comment-summary-in-pr: always

  vulnerable-packages:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Bootstrap (restore)
        run: dotnet restore PodBridge.slnx

      - name: Check for known-vulnerable packages
        shell: pwsh
        run: |
          $output = dotnet list PodBridge.slnx package --vulnerable --include-transitive 2>&1 | Tee-Object -Variable rawOutput
          $rawOutput | Write-Host
          if ($rawOutput -match 'has the following vulnerable packages') {
            Write-Error "Known-vulnerable NuGet packages detected. See output above."
            exit 1
          }
